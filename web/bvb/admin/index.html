<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cashly · Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080B0D;--panel:#0F1417;--line:#1B242A;--txt:#ECEFF3;--mut:#78818F;--tl:#C99A2E;--tl2:#E8B94A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:14px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
.hero{text-align:center;padding:24px 14px 20px;margin-bottom:16px;border-radius:16px;background:var(--panel);border:1px solid var(--tl)}
.hero .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2.6px;color:var(--mut);text-transform:uppercase}
.hero .num{font-family:'Space Grotesk',sans-serif;font-size:clamp(38px,11vw,56px);font-weight:700;color:var(--tl2);letter-spacing:-2px;line-height:1;margin:12px 0 10px}
.hero .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);margin-top:10px}
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 12px;border-radius:20px;background:rgba(232,185,74,.12);color:var(--tl2);border:1px solid rgba(232,185,74,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}
.card .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.card .v{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-top:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
.panel h2{font-size:12.5px;font-weight:600;margin-bottom:12px}
svg{display:block;width:100%;height:auto}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px}
th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.1px;color:var(--mut);text-transform:uppercase;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:10px 6px;border-bottom:1px solid rgba(27,36,42,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
.q{color:var(--tl2);font-weight:600;font-family:'IBM Plex Mono',monospace}
.mut{color:var(--mut)}
.box{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;background:rgba(255,255,255,.012)}
.box .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.box .nm{font-weight:600;font-size:14px}
.box .st{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--mut);text-transform:uppercase}
.box .st.on{color:var(--tl2);border-color:rgba(232,185,74,.35);background:rgba(232,185,74,.1)}
.box .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--mut)}
.box .row b{color:var(--txt);font-family:'IBM Plex Mono',monospace}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:26px 10px}

  .live{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    letter-spacing:2px;color:#78818F;text-transform:uppercase;margin-bottom:14px}
  .live i{width:8px;height:8px;border-radius:50%;background:#E8B94A;display:inline-block;
    animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,185,74,.55)}70%{box-shadow:0 0 0 9px rgba(232,185,74,0)}100%{box-shadow:0 0 0 0 rgba(232,185,74,0)}}
table.inc{table-layout:auto}
table.inc td:first-child,table.inc th:first-child{white-space:normal;width:auto}
table.inc td:nth-child(2),table.inc th:nth-child(2){width:44px}
.periodi{display:flex;gap:2px;margin:0 0 10px;border-bottom:1px solid #1B242A}
.periodi button{flex:1;background:none;border:0;cursor:pointer;padding:8px 2px 9px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:#78818F;border-bottom:2px solid transparent;margin-bottom:-1px}
.periodi button.on{color:#E8B94A;border-bottom-color:#E8B94A}
#reteIncassi{width:100%;background:#131A1D;border:1px solid #1B242A;color:#ECEFF3;
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 10px;border-radius:7px;margin-bottom:10px}
.somma{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid #1B242A;margin-bottom:8px;padding-bottom:12px}
.somma .et{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:#78818F}
.somma .q2{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#78818F}
.somma .v{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-size:17px;
  font-weight:600;color:#E8B94A}
.somma .det{width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#78818F}
</style></head><body>
<div class="wrap" id="app"><div class="empty">Carico i dati…</div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const P=new URLSearchParams(location.search);
const API='https://jwpbopkoscqooovfvwqn.supabase.co/functions/v1/bvb2/api/admin';
const U=n=>Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT';
const U0=n=>Math.round(n).toLocaleString('it-IT')+' USDT';
const E0=n=>'€ '+Math.round(n).toLocaleString('it-IT');
const MM=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const dBrev=s=>{const d=new Date(s);return d.getDate()+' '+MM[d.getMonth()];};

function area(v,lab){
 if(v.length<2) return '';
 const W=680,H=190,pd={l:60,r:14,t:14,b:26};
 const mx=Math.max(...v)*1.1||1, iw=W-pd.l-pd.r, ih=H-pd.t-pd.b;
 const X=i=>pd.l+i*iw/(v.length-1), Y=x=>pd.t+ih-(x/mx)*ih;
 let g='';
 for(let i=0;i<=4;i++){const y=pd.t+ih*i/4;
  g+='<line x1="'+pd.l+'" y1="'+y+'" x2="'+(W-pd.r)+'" y2="'+y+'" stroke="#1B242A"/>'+
     '<text x="'+(pd.l-8)+'" y="'+(y+4)+'" fill="#78818F" font-size="10" text-anchor="end" font-family="monospace">'+Math.round(mx-mx*i/4)+'</text>';}
 const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(0)+' '+Y(x).toFixed(0)).join(' ');
 const a='M'+pd.l+' '+(pd.t+ih)+' '+v.map((x,i)=>'L'+X(i).toFixed(0)+' '+Y(x).toFixed(0)).join(' ')+' L'+(W-pd.r)+' '+(pd.t+ih)+' Z';
 let lb='';const st=Math.ceil(lab.length/6);
 lab.forEach((l,i)=>{if(i%st===0||i===lab.length-1)lb+='<text x="'+X(i).toFixed(0)+'" y="'+(H-7)+'" fill="#78818F" font-size="10" text-anchor="middle" font-family="monospace">'+l+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'<path d="'+a+'" fill="rgba(201,154,46,.12)"/><path d="'+d+'" fill="none" stroke="#C99A2E" stroke-width="2.2"/>'+lb+'</svg>';
}

fetch(API+'?t='+encodeURIComponent(P.get('t')||''))
 .then(r=>r.json()).then(d=>{
  if(d.error){document.getElementById('app').innerHTML='<div class="empty">Accesso non valido.<br>Riapri il link dal bot.</div>';return;}
  const cic=d.cicli||[], reti=d.reti||[], cli=d.clienti||[], cap=d.capitale||{};
  const pers=d.personale||{cicli:0,netto:0,lordo:0,capitale:0}, CB=d.cambio||1.17;
  const mio=cic.reduce((a,x)=>a+x.mio,0);
  const feeTot=cic.reduce((a,x)=>a+x.feeU,0);
  const profTot=cic.reduce((a,x)=>a+x.profitto,0);
  const attivi=new Set(cli.filter(x=>x.stato==='attivo'||x.stato==='pronto'||x.stato==='attesa').map(x=>x.padre||x.codice)).size;
  // un cliente con due conti resta una persona sola
  const persone=new Set(cli.map(x=>x.padre||x.codice)).size;
  // ogni conto aggiuntivo subito sotto il suo principale
  const ordinati=[]; const figli={};
  cli.forEach(x=>{ if(x.padre) (figli[x.padre]=figli[x.padre]||[]).push(x); });
  cli.forEach(x=>{ if(x.padre) return; ordinati.push(x); (figli[x.codice]||[]).forEach(y=>ordinati.push(y)); });

  // per giorno
  const gg=new Map();
  cic.forEach(x=>{const o=gg.get(x.data)||{n:0,fee:0,mio:0};o.n++;o.fee+=x.feeU;o.mio+=x.mio;gg.set(x.data,o);});
  const gs=[...gg.entries()].sort();
  let cc=0; const giorni=gs.map(([k,v])=>{cc+=v.mio;return {k,...v,cum:cc};});

  let h='<div class="live"><i></i>Dati aggiornati in tempo reale</div>';
  h+='<div class="hero"><div class="lbl">Il tuo netto</div>'+
     '<div class="num">'+U0(mio)+'</div>'+
     '<div class="badge">'+U0(feeTot)+' incassati</div>'+
     '<div class="meta">'+cic.length+' cicli · '+persone+' clienti · '+reti.length+' reti</div></div>';

  h+='<div class="stats">'+
     '<div class="card"><div class="k">Capitale gestito</div><div class="v">'+E0(cap.totale||0)+'</div></div>'+
     '<div class="card"><div class="k">In ciclo ora</div><div class="v">'+E0(cap.inCorso||0)+'</div></div>'+
     '<div class="card"><div class="k">Clienti attivi</div><div class="v">'+attivi+'</div></div></div>';

  // totale complessivo
  const netRete=mio, netPers=pers.netto*CB, netTot=netRete+netPers;
  h+='<div class="panel" style="border-color:#C99A2E"><h2>Totale complessivo</h2>'+
     '<div class="box"><div class="row"><span>Dalla rete · '+cic.length+(cic.length===1?' ciclo':' cicli')+'</span><b class="q">'+U(netRete)+'</b></div>'+
     '<div class="row"><span>Dai tuoi conti · '+pers.cicli+(pers.cicli===1?' ciclo':' cicli')+'</span><b class="q">'+U(netPers)+'</b></div>'+
     '<div class="row" style="border-top:1px solid #1B242A;margin-top:8px;padding-top:12px"><span style="color:#ECEFF3;font-weight:600">Totale</span>'+
     '<b style="color:#E8B94A;font-size:17px">'+U0(netTot)+'</b></div>'+
     '<div class="row"><span>In euro</span><b>'+E0(netTot/CB)+'</b></div></div>'+
     '<div style="font-family:monospace;font-size:10px;color:#78818F;margin-top:10px;line-height:1.6">'+
     'Capitale tuo '+E0(pers.capitale)+' · lordo generato '+E0(pers.lordo)+'</div></div>';


  if(giorni.length>1)
   h+='<div class="panel"><h2>Il tuo netto nel tempo</h2>'+area(giorni.map(x=>x.cum),giorni.map(x=>dBrev(x.k)))+'</div>';

  h+='<div class="panel"><h2>Le tue reti</h2>';
  reti.forEach(r=>{
   h+='<div class="box"><div class="top"><span class="nm">'+r.nome+'</span>'+
      '<span class="st on">'+r.clienti+(r.clienti===1?' cliente':' clienti')+'</span></div>'+
      '<div class="row"><span>Cicli chiusi</span><b>'+r.cicli+'</b></div>'+
      '<div class="row"><span>Profitto generato</span><b>'+E0(r.profitto)+'</b></div>'+
      '<div class="row"><span>Fee incassate</span><b>'+U(r.feeU)+'</b></div>'+
      (r.quota>0?'<div class="row"><span>Spettante a loro</span><b>'+U(r.quota)+'</b></div>':'')+
      '<div class="row"><span>Il tuo netto</span><b class="q">'+U(r.mio)+'</b></div></div>';
  });
  h+='</div>';

  if(cic.length){
   const nomiReti=[...new Set(cic.map(x=>x.rete))].sort();
   h+='<div class="panel"><h2>Registro incassi</h2>'+
      '<div class="periodi" id="perIncassi">'+
      ['giorno','settimana','mese','anno'].map(x=>
        '<button data-per="'+x+'"'+(x==='giorno'?' class="on"':'')+'>'+x+'</button>').join('')+
      '</div>'+
      '<select id="reteIncassi"><option value="">Tutte le reti</option>'+
      nomiReti.map(r=>'<option value="'+r+'">'+r+'</option>').join('')+'</select>'+
      '<div class="somma" id="sommaIncassi"></div>'+
      '<div id="corpoIncassi"></div></div>';
  }

  h+='<style>.box.sub{margin-left:14px;border-left:2px solid var(--q,#c9a227);}.box.sub .nm{opacity:.8}</style>';
  h+='<div class="panel"><h2>Clienti</h2>';
  ordinati.forEach(x=>{
   const on=x.stato==='attivo'||x.stato==='pronto';
   const tit=x.padre?x.codice+' · conto '+(x.conto||2):x.codice+' · '+x.nome;
   h+='<div class="box'+(x.padre?' sub':'')+'"><div class="top"><span class="nm">'+tit+'</span>'+
      '<span class="st'+(on?' on':'')+'">'+x.stato+'</span></div>'+
      '<div class="row"><span>Rete</span><b>'+x.rete+'</b></div>'+
      '<div class="row"><span>Capitale</span><b>'+E0(x.capitale)+'</b></div>'+
      '<div class="row"><span>Cicli chiusi</span><b>'+x.cicli+'</b></div>'+
      '<div class="row"><span>Profitto generato</span><b>'+E0(x.profitto)+'</b></div>'+
      '<div class="row"><span>Il tuo netto</span><b class="q">'+U(x.mio)+'</b></div>'+
      (x.ultimo?'<div class="row"><span>Ultimo ciclo</span><b>'+dBrev(x.ultimo)+'</b></div>':'')+
      '</div>';
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;

  // Registro incassi: si guarda per giorno, settimana, mese o anno, e si puo'
  // isolare una rete. La somma sta in cima, cosi' si legge senza scorrere.
  let perInc='giorno', reteInc='';
  const lunedi=iso=>{const d=new Date(iso+'T12:00:00');
    d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));return d.toISOString().slice(0,10);};
  const chiaveP=(iso,per)=>per==='giorno'?iso.slice(0,10):per==='settimana'?lunedi(iso)
    :per==='anno'?iso.slice(0,4):iso.slice(0,7);
  const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
              'agosto','settembre','ottobre','novembre','dicembre'];
  const titoloP=(iso,per)=>{const d=new Date(iso+'T12:00:00');
    if(per==='giorno') return d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear();
    if(per==='settimana'){const l=new Date(lunedi(iso)+'T12:00:00');
      return 'dal '+l.getDate()+' '+MESI[l.getMonth()];}
    if(per==='anno') return String(d.getFullYear());
    return MESI[d.getMonth()]+' '+d.getFullYear();};

  function renderIncassi(){
   const corpo=document.getElementById('corpoIncassi');
   if(!corpo) return;
   const sel=cic.filter(x=>!reteInc||x.rete===reteInc);
   const g=new Map();
   sel.forEach(x=>{const k=chiaveP(x.data,perInc);
    const o=g.get(k)||{n:0,fee:0,mio:0,prof:0,titolo:titoloP(x.data,perInc)};
    o.n++;o.fee+=x.feeU;o.mio+=x.mio;o.prof+=x.profitto;g.set(k,o);});
   const righe=[...g.entries()].sort((a,b)=>b[0].localeCompare(a[0]));

   const mioS=sel.reduce((a,x)=>a+x.mio,0), feeS=sel.reduce((a,x)=>a+x.feeU,0);
   const profS=sel.reduce((a,x)=>a+x.profitto,0);
   const tutto=sel.length===cic.length;
   document.getElementById('sommaIncassi').innerHTML= sel.length
    ? '<span class="et">'+(tutto?'Totale':'Totale filtrato')+'</span>'
      +'<span class="q2">'+sel.length+(sel.length===1?' ciclo':' cicli')+'</span>'
      +'<span class="v">'+U0(mioS)+'</span>'
      +'<span class="det">fee incassate '+U0(feeS)+' · profitto generato '+E0(profS)+'</span>'
    : '<span class="et">Nessun ciclo con questo filtro</span>';

   corpo.innerHTML= righe.length
    ? '<table class="inc"><tr><th>'+perInc+'</th><th>Cicli</th><th>Fee</th><th>Netto</th></tr>'
      +righe.map(([k,v])=>'<tr><td>'+v.titolo+'</td><td class="mut">'+v.n+'</td>'
        +'<td class="mut">'+U0(v.fee)+'</td><td class="q">'+U0(v.mio)+'</td></tr>').join('')
      +'</table>'
    : '';
  }

  const barra=document.getElementById('perIncassi');
  if(barra) barra.addEventListener('click',e=>{
   const b=e.target.closest('button'); if(!b) return;
   perInc=b.dataset.per;
   barra.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
   renderIncassi();
  });
  const selRete=document.getElementById('reteIncassi');
  if(selRete) selRete.addEventListener('change',e=>{reteInc=e.target.value;renderIncassi();});
  renderIncassi();
 })
 .catch(()=>{document.getElementById('app').innerHTML='<div class="empty">Errore di connessione.</div>';});
</script></body></html>
