<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard partner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo+Narrow:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06050C;--panel:#100C22;--line:#1E1938;--txt:#FFFFFF;--mut:#8E8CA8;--tl:#22E07C;--tl2:#35EE8C;--red:#F2645A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:14px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
.hero{text-align:center;padding:24px 14px 20px;margin-bottom:16px;border-radius:16px;background:var(--panel);border:1px solid var(--tl)}
.hero .lbl{font-family:'Archivo Narrow',sans-serif;font-size:10px;letter-spacing:2.6px;color:var(--mut);text-transform:uppercase}
.hero .num{font-family:'Space Grotesk',sans-serif;font-size:clamp(38px,11vw,58px);font-weight:700;color:var(--tl2);letter-spacing:-2px;line-height:1;margin:12px 0 10px}
.hero .meta{font-family:'Archivo Narrow',sans-serif;font-size:11px;color:var(--mut)}
.badge{display:inline-block;font-family:'Archivo Narrow',sans-serif;font-size:12px;padding:5px 12px;border-radius:20px;background:rgba(53,238,140,.12);color:var(--tl2);border:1px solid rgba(53,238,140,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}
.card .k{font-family:'Archivo Narrow',sans-serif;font-size:8.5px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.card .v{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-top:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
.panel h2{font-size:12.5px;font-weight:600;margin-bottom:12px;letter-spacing:.2px}
svg{display:block;width:100%;height:auto}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px}
th{font-family:'Archivo Narrow',sans-serif;font-size:9px;letter-spacing:1.1px;color:var(--mut);text-transform:uppercase;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:10px 6px;border-bottom:1px solid rgba(30,25,56,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){text-align:right}
tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
.q{color:var(--tl2);font-weight:600;font-family:'Archivo Narrow',sans-serif}
.mut{color:var(--mut)}
.cli{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;background:rgba(255,255,255,.012)}
.cli .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.cli .nm{font-weight:600;font-size:14px}
.cli .st{font-family:'Archivo Narrow',sans-serif;font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--mut);text-transform:uppercase}
.cli .st.on{color:var(--tl2);border-color:rgba(53,238,140,.35);background:rgba(53,238,140,.1)}
.cli .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--mut)}
.cli .row b{color:var(--txt);font-family:'Archivo Narrow',sans-serif}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:26px 10px}

  .live{display:inline-flex;align-items:center;gap:7px;font-family:'Archivo Narrow',sans-serif;font-size:9.5px;
    letter-spacing:2px;color:#8E8CA8;text-transform:uppercase;margin-bottom:14px}
  .live i{width:8px;height:8px;border-radius:50%;background:#35EE8C;display:inline-block;
    animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,238,140,.55)}70%{box-shadow:0 0 0 9px rgba(53,238,140,0)}100%{box-shadow:0 0 0 0 rgba(53,238,140,0)}}
table.inc{table-layout:auto}
table.inc td:first-child,table.inc th:first-child{white-space:normal;width:auto}
table.inc td:nth-child(2),table.inc th:nth-child(2){width:44px}
.periodi{display:flex;gap:2px;margin:0 0 10px;border-bottom:1px solid #1E1938}
.periodi button{flex:1;background:none;border:0;cursor:pointer;padding:8px 2px 9px;
  font-family:'Archivo Narrow',sans-serif;font-size:10.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:#8E8CA8;border-bottom:2px solid transparent;margin-bottom:-1px}
.periodi button.on{color:#35EE8C;border-bottom-color:#35EE8C}
#cliInc{width:100%;background:#16112E;border:1px solid #1E1938;color:#FFFFFF;
  font-family:'Archivo Narrow',sans-serif;font-size:12px;padding:8px 10px;border-radius:7px;margin-bottom:10px}
.somma{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid #1E1938;margin-bottom:8px;padding-bottom:12px}
.somma .et{font-family:'Archivo Narrow',sans-serif;font-size:10.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:#8E8CA8}
.somma .q2{font-family:'Archivo Narrow',sans-serif;font-size:11px;color:#8E8CA8}
.somma .v{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-size:17px;
  font-weight:600;color:#35EE8C}
.somma .det{width:100%;font-family:'Archivo Narrow',sans-serif;font-size:11px;color:#8E8CA8}

  /* senza il monospaziato le cifre hanno larghezze diverse e le colonne
     ballano: queste le rimettono tutte della stessa larghezza */
  body{font-variant-numeric:tabular-nums}
</style></head><body>
<div class="wrap" id="app"><div class="empty">Carico i dati…</div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const P=new URLSearchParams(location.search);
const API='https://jwpbopkoscqooovfvwqn.supabase.co/functions/v1/bvb2/api/partner';
const U=n=>Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT';
const U0=n=>Math.round(n).toLocaleString('it-IT')+' USDT';
const E0=n=>'€ '+Math.round(n).toLocaleString('it-IT');
const MM=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const dBrev=s=>{const d=new Date(s);return d.getDate()+' '+MM[d.getMonth()];};

function area(v,lab){
 if(v.length<2) return '';
 const W=680,H=190,pd={l:56,r:14,t:14,b:26};
 const mx=Math.max(...v)*1.1||1, iw=W-pd.l-pd.r, ih=H-pd.t-pd.b;
 const X=i=>pd.l+i*iw/(v.length-1), Y=x=>pd.t+ih-(x/mx)*ih;
 let g='';
 for(let i=0;i<=4;i++){const y=pd.t+ih*i/4;
  g+='<line x1="'+pd.l+'" y1="'+y+'" x2="'+(W-pd.r)+'" y2="'+y+'" stroke="#1E1938"/>'+
     '<text x="'+(pd.l-8)+'" y="'+(y+4)+'" fill="#8E8CA8" font-size="10" text-anchor="end" font-family="monospace">'+Math.round(mx-mx*i/4)+'</text>';}
 const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(0)+' '+Y(x).toFixed(0)).join(' ');
 const a='M'+pd.l+' '+(pd.t+ih)+' '+v.map((x,i)=>'L'+X(i).toFixed(0)+' '+Y(x).toFixed(0)).join(' ')+' L'+(W-pd.r)+' '+(pd.t+ih)+' Z';
 let lb='';const st=Math.ceil(lab.length/6);
 lab.forEach((l,i)=>{if(i%st===0||i===lab.length-1)lb+='<text x="'+X(i).toFixed(0)+'" y="'+(H-7)+'" fill="#8E8CA8" font-size="10" text-anchor="middle" font-family="monospace">'+l+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'<path d="'+a+'" fill="rgba(34,224,124,.12)"/><path d="'+d+'" fill="none" stroke="#22E07C" stroke-width="2.2"/>'+
  v.map((x,i)=>'<circle cx="'+X(i).toFixed(0)+'" cy="'+Y(x).toFixed(0)+'" r="3" fill="#22E07C"/>').join('')+lb+'</svg>';
}
function barre(v,lab){
 if(!v.length) return '';
 const W=680,H=170,pd={l:56,r:14,t:14,b:26};
 const mx=Math.max(...v)*1.15||1, iw=W-pd.l-pd.r, ih=H-pd.t-pd.b;
 const bw=Math.min(44,iw/v.length*.6);
 let g='';
 for(let i=0;i<=4;i++){const y=pd.t+ih*i/4;
  g+='<line x1="'+pd.l+'" y1="'+y+'" x2="'+(W-pd.r)+'" y2="'+y+'" stroke="#1E1938"/>'+
     '<text x="'+(pd.l-8)+'" y="'+(y+4)+'" fill="#8E8CA8" font-size="10" text-anchor="end" font-family="monospace">'+Math.round(mx-mx*i/4)+'</text>';}
 let b='';
 v.forEach((x,i)=>{const cx=pd.l+(i+.5)*iw/v.length, h=Math.max(2,x/mx*ih);
  b+='<rect x="'+(cx-bw/2).toFixed(0)+'" y="'+(pd.t+ih-h).toFixed(0)+'" width="'+bw.toFixed(0)+'" height="'+h.toFixed(0)+'" rx="4" fill="#22E07C" opacity=".85"/>'+
     '<text x="'+cx.toFixed(0)+'" y="'+(H-7)+'" fill="#8E8CA8" font-size="10" text-anchor="middle" font-family="monospace">'+lab[i]+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'">'+g+b+'</svg>';
}

fetch(API+'?t='+encodeURIComponent(P.get('t')||''))
 .then(r=>r.json()).then(d=>{
  if(d.error){document.getElementById('app').innerHTML='<div class="empty">Accesso non valido.<br>Riapri il link dal bot.</div>';return;}
  const p=d.partner, cic=d.cicli||[], cli=d.clienti||[];
  document.title=p.nome+' · Dashboard';
  const forn=p.tipo==='fornitore';

  // aggrego per giorno
  const gg=new Map();
  cic.forEach(x=>{const o=gg.get(x.data)||{n:0,incasso:0,quota:0};
   o.n++; o.incasso+=forn?x.fee:x.profitto; o.quota+=x.quota; gg.set(x.data,o);});
  const gs=[...gg.entries()].sort();
  let cc=0; const giorni=gs.map(([k,v])=>{cc+=v.quota;return {k,...v,cum:cc};});

  const tot=cic.reduce((a,x)=>a+x.quota,0);
  const volume=cic.reduce((a,x)=>a+(forn?x.fee:x.profitto),0);
  const attivi=cli.filter(x=>x.stato==='attivo'||x.stato==='pronto').length;
  const mediaGiorno=giorni.length?tot/giorni.length:0;

  let h='<div class="live"><i></i>Dati aggiornati in tempo reale</div>';

  h+='<div class="hero"><div class="lbl">Profitto netto generato</div>'+
     '<div class="num">'+U0(tot)+'</div>'+
     '<div class="badge">'+p.percentuale+'% '+(forn?'sulle fee':'sul profitto')+'</div>'+
     '<div class="meta" style="margin-top:12px">'+p.nome+' · ultimo '+(giorni.length?dBrev(giorni[giorni.length-1].k):'—')+'</div></div>';

  h+='<div class="stats">'+
     '<div class="card"><div class="k">Cicli di rete</div><div class="v">'+cic.length+'</div></div>'+
     '<div class="card"><div class="k">Clienti attivi</div><div class="v">'+attivi+'</div></div>'+
     '<div class="card"><div class="k">Media al giorno</div><div class="v">'+(mediaGiorno?U0(mediaGiorno):'—')+'</div></div></div>';

  if(giorni.length>1){
   h+='<div class="panel"><h2>Andamento incassi fee</h2>'+area(giorni.map(x=>x.cum),giorni.map(x=>dBrev(x.k)))+'</div>';
   const per=new Map();
   giorni.forEach(x=>{const k=x.k.slice(0,7);per.set(k,(per.get(k)||0)+x.quota);});
   const ms=[...per.entries()].sort();
   if(ms.length>1) h+='<div class="panel"><h2>Incasso fee per mese</h2>'+barre(ms.map(m=>m[1]),ms.map(m=>MM[+m[0].split('-')[1]-1]))+'</div>';
  }

  h+='<div class="panel"><h2>Registro incassi</h2>';
  if(!cic.length) h+='<div class="empty">Nessun incasso registrato.</div>';
  else{
   const nomiCli=[...new Set(cic.map(x=>x.codice+' · '+x.cliente))].sort();
   h+='<div class="periodi" id="perInc">'+
      ['giorno','settimana','mese','anno'].map(x=>
        '<button data-per="'+x+'"'+(x==='giorno'?' class="on"':'')+'>'+x+'</button>').join('')+
      '</div>'+
      '<select id="cliInc"><option value="">Tutti i clienti</option>'+
      nomiCli.map(c=>'<option value="'+c.split(' · ')[0]+'">'+c+'</option>').join('')+'</select>'+
      '<div class="somma" id="sommaInc"></div>'+
      '<div id="corpoInc"></div>';
  }
  h+='</div>';

  h+='<div class="panel"><h2>I tuoi clienti</h2>';
  if(!cli.length) h+='<div class="empty">Nessun cliente assegnato.</div>';
  cli.forEach(x=>{
   const on=x.stato==='attivo'||x.stato==='pronto';
   h+='<div class="cli"><div class="top"><span class="nm">'+x.codice+' · '+x.nome+'</span>'+
      '<span class="st'+(on?' on':'')+'">'+x.stato+'</span></div>'+
      '<div class="row"><span>Cicli chiusi</span><b>'+x.cicli+'</b></div>'+
      '<div class="row"><span>Profitto generato</span><b>'+E0(x.profitto)+'</b></div>'+
      '<div class="row"><span>Il tuo guadagno</span><b class="q">'+U(x.quota)+'</b></div>'+
      (x.ultimo?'<div class="row"><span>Ultimo ciclo</span><b>'+dBrev(x.ultimo)+'</b></div>':'')+
      '</div>';
  });
  h+='</div>';

  document.getElementById('app').innerHTML=h;

  // Registro incassi: per giorno, settimana, mese o anno, e si puo' isolare
  // un cliente. La somma sta in cima, cosi' si legge senza scorrere.
  let perInc='giorno', cliInc='';
  const lunedi=iso=>{const d=new Date(iso+'T12:00:00');
    d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));return d.toISOString().slice(0,10);};
  const chiaveP=(iso,per)=>per==='giorno'?iso.slice(0,10):per==='settimana'?lunedi(iso)
    :per==='anno'?iso.slice(0,4):iso.slice(0,7);
  const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
              'agosto','settembre','ottobre','novembre','dicembre'];
  const titoloP=(iso,per)=>{const d=new Date(iso+'T12:00:00');
    if(per==='giorno') return d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear();
    if(per==='settimana'){const l=new Date(lunedi(iso)+'T12:00:00');
      return 'dal '+l.getDate()+' '+MESI[l.getMonth()];}
    if(per==='anno') return String(d.getFullYear());
    return MESI[d.getMonth()]+' '+d.getFullYear();};

  function renderInc(){
   const corpo=document.getElementById('corpoInc');
   if(!corpo) return;
   const sel=cic.filter(x=>!cliInc||x.codice===cliInc);
   const g=new Map();
   sel.forEach(x=>{const k=chiaveP(x.data,perInc);
    const o=g.get(k)||{n:0,incasso:0,quota:0,titolo:titoloP(x.data,perInc)};
    o.n++; o.incasso+=forn?x.fee:x.profitto; o.quota+=x.quota; g.set(k,o);});
   const righe=[...g.entries()].sort((a,b)=>b[0].localeCompare(a[0]));

   const quotaS=sel.reduce((a,x)=>a+x.quota,0);
   const volS=sel.reduce((a,x)=>a+(forn?x.fee:x.profitto),0);
   const tutto=sel.length===cic.length;
   document.getElementById('sommaInc').innerHTML= sel.length
    ? '<span class="et">'+(tutto?'Totale':'Totale filtrato')+'</span>'
      +'<span class="q2">'+sel.length+(sel.length===1?' ciclo':' cicli')+'</span>'
      +'<span class="v">'+U0(quotaS)+'</span>'
      +'<span class="det">'+(forn?'fee di rete ':'profitto generato ')+E0(volS)+
        ' · la tua quota '+p.percentuale+'%</span>'
    : '<span class="et">Nessun ciclo con questo filtro</span>';

   corpo.innerHTML= righe.length
    ? '<table class="inc"><tr><th>'+perInc+'</th><th>Cicli</th><th>Incasso</th><th>Guadagno</th></tr>'
      +righe.map(([k,v])=>'<tr><td>'+v.titolo+'</td><td class="mut">'+v.n+'</td>'
        +'<td class="mut">'+E0(v.incasso)+'</td><td class="q">'+U0(v.quota)+'</td></tr>').join('')
      +'</table>'
    : '';
  }

  const barra=document.getElementById('perInc');
  if(barra) barra.addEventListener('click',e=>{
   const b=e.target.closest('button'); if(!b) return;
   perInc=b.dataset.per;
   barra.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
   renderInc();
  });
  const selCli=document.getElementById('cliInc');
  if(selCli) selCli.addEventListener('change',e=>{cliInc=e.target.value;renderInc();});
  renderInc();
 })
 .catch(()=>{document.getElementById('app').innerHTML='<div class="empty">Errore di connessione.</div>';});
</script></body></html>
