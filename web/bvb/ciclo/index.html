<!DOCTYPE html><html lang="it"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cashly · Ciclo</title>
<script src="https://telegram.org/js/telegram-web-app.js">
async function inviaInChat(){
 try{
  const img=await fai();
  const r=await fetch(APIS,{method:'POST',headers:{'content-type':'application/json'},
   body:JSON.stringify({t:new URLSearchParams(location.search).get('t')||'',img:img,testo:TESTO})});
  const j=await r.json();
  return !!j.ok;
 }catch(e){ return false; }
}

async function conImmagine(app){
 chiudi();
 const ok=await inviaInChat();
 if(!ok){ avvisa("Non riesco a preparare l'immagine."); return; }
 if(app==='telegram'){
  avvisa("Immagine pronta in chat: tienila premuta e inoltrala.");
  setTimeout(()=>{ if(window.Telegram?.WebApp) Telegram.WebApp.close(); },1500);
  return;
 }
 avvisa("Immagine pronta in chat.\nTienila premuta, scegli Condividi e poi l'app che vuoi.");
 setTimeout(()=>{ if(window.Telegram?.WebApp) Telegram.WebApp.close(); },2200);
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06050C; --card1:#221A4A; --card2:#0E0A1E; --card3:#08060F;
  --line:#1E1938; --txt:#FFFFFF; --mut:#8E8CA8; --mut2:#5F5D78;
  --verde:#22E07C; --verde2:#19C46B;
  --gold:#22E07C; --gold2:#22E07C; --grn:#22E07C;
  --f:Manrope,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f);padding:16px;
     min-height:100vh;display:flex;flex-direction:column;align-items:center;
     justify-content:center;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:420px}

/* la card: il bagliore sta nel fondo, non in uno pseudo-elemento,
   cosi' html2canvas lo porta dentro l'immagine da condividere */
.card{position:relative;border-radius:26px;padding:32px 24px 30px;overflow:hidden;
      text-align:center;border:1px solid rgba(255,255,255,.07);
      background:radial-gradient(120% 78% at 50% 0%,var(--card1) 0%,var(--card2) 62%,var(--card3) 100%)}
.card:before{content:"";position:absolute;inset:0;pointer-events:none}

.live{display:inline-flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:2px;
      color:var(--mut2);text-transform:uppercase;font-weight:700;margin-bottom:16px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--verde);display:inline-block;
        animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,224,124,.55)}
  70%{box-shadow:0 0 0 9px rgba(34,224,124,0)}100%{box-shadow:0 0 0 0 rgba(34,224,124,0)}}

.brand{font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--txt);text-transform:none}
.rule{height:1px;margin:18px 0 34px;background:rgba(255,255,255,.08)}
.k{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--mut2);font-weight:700}
.amt{font-size:clamp(50px,14vw,68px);font-weight:800;color:var(--verde);letter-spacing:-2.6px;
     line-height:1;margin:16px 0 18px;
     text-shadow:0 0 44px rgba(34,224,124,.42),0 0 88px rgba(34,224,124,.15)}
.roi{display:inline-block;font-size:13.5px;font-weight:700;color:var(--verde);
     border:1px solid rgba(34,224,124,.28);background:rgba(34,224,124,.1);
     padding:7px 15px;border-radius:22px;letter-spacing:.2px}
.who{margin-top:30px;font-size:11.5px;color:var(--mut2);letter-spacing:.8px;font-weight:600}
.who b{color:var(--txt);font-weight:800;letter-spacing:-.1px}

.btns{display:flex;gap:10px;margin-top:16px}
button{flex:1;background:var(--verde);color:#04240F;border:0;border-radius:14px;padding:15px;
       font-family:var(--f);font-size:14.5px;font-weight:800;cursor:pointer;letter-spacing:-.1px}
button:hover{background:var(--verde2)}
button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
button:focus-visible{outline:3px solid rgba(34,224,124,.5);outline-offset:2px}

#sheet{display:none;position:fixed;inset:0;background:rgba(4,3,10,.8);z-index:99;
       align-items:flex-end;justify-content:center}
#sheet .in{width:100%;max-width:480px;background:#100C22;border:1px solid var(--line);
       border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet .t{font-size:10px;letter-spacing:2.4px;color:var(--mut2);text-transform:uppercase;
       text-align:center;margin-bottom:16px;font-weight:700}
#sheet .g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#sheet .g button{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:15px;
       padding:14px 6px;color:var(--txt);font-size:11.5px;font-weight:700;cursor:pointer;
       display:flex;flex-direction:column;align-items:center;gap:7px}
#sheet .g button:hover{background:rgba(255,255,255,.08)}
#sheet .g button span{font-size:22px;line-height:1}
#sheet .x{width:100%;margin-top:14px;background:transparent;border:1px solid var(--line);
       border-radius:14px;padding:13px;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap">
<div class="card">
  <div class="live"><i></i>Verificato on-chain</div>
  <div class="brand" id="brand">Broker vs Broker</div>
  <div class="rule"></div>
  <div class="k">Guadagno ciclo <span id="ncic"></span></div>
  <div class="amt" id="big">—</div>
  <div class="roi" id="roi">—</div>
  <div class="who"><b id="who">—</b> · <span id="dt">—</span><span id="durw"></span></div>
</div>
<div id="back" style="display:none;text-align:center;margin-bottom:12px">
  <a href="#" onclick="tornaDashboard();return false" style="color:var(--mut);font-size:12.5px;text-decoration:none">‹ Torna alla dashboard</a>
</div>
<div class="btns">
  <button onclick="condividi()">Condividi</button>

</div>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const P=new URLSearchParams(location.search);
const API='https://jwpbopkoscqooovfvwqn.supabase.co/functions/v1/bvb2/api/cicli';
const E=n=>'€ '+Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const E0=n=>'€ '+Math.round(n).toLocaleString('it-IT');
const PC=n=>(n>=0?'+':'')+n.toFixed(2).replace('.',',')+'%';
let TESTO='';
function durata(a,b){
 const ms=new Date(b)-new Date(a);
 if(!(ms>0)) return '';
 const h=Math.floor(ms/36e5);
 if(h<1) return Math.max(1,Math.round(ms/6e4))+' min';
 if(h<24) return h+(h===1?' ora':' ore');
 const g=Math.floor(h/24), r=h%24;
 return g+(g===1?' giorno':' giorni')+(r>=2?' e '+r+'h':'');
}
async function carica(){
 const t=P.get('t')||''; if(!t) return;
 const r=await fetch(API+'?t='+encodeURIComponent(t)); const d=await r.json();
 const c=(d.cicli||[]); if(!c.length) return;
 const nRich=parseInt(P.get('n')||'0',10);
 const u=(nRich? c.find(x=>x.n===nRich) : null) || c[c.length-1];
 const netto=u.lordo-u.fee, roi=u.capitale?netto/u.capitale*100:0;
 let cum=0;
 for(const x of c){ cum+=x.lordo-x.fee; if(x.n===u.n) break; }
 ncic.textContent='#'+u.n;
 if(nRich){ const b=document.getElementById('back'); if(b) b.style.display='block'; }
 big.textContent=E(netto);
 roi_el().textContent=PC(roi);
 who.textContent=d.cliente?.nome||'';
 document.getElementById('brand').textContent=(d.cliente?.brand||'Cashly')+' · Broker vs Broker';
 document.title=(d.cliente?.brand||'Cashly')+' · Ciclo';
 dt.textContent=new Date(u.data).toLocaleDateString('it-IT');
 const dur=u.avvio?durata(u.avvio,u.data):'';
 TESTO='Ho guadagnato '+E(netto)+(dur?' in '+dur:'')+' con la strategia di hedging Broker vs Broker.'+(roi?'\n\nRendimento '+PC(roi):'');
 const el=document.getElementById('durw'); if(el&&dur) el.textContent=' · '+dur;
}
function roi_el(){return document.getElementById('roi');}
let IMG=null;
function tornaDashboard(){
 const t=new URLSearchParams(location.search).get('t')||'';
 location.href='https://hub.cashlypro.com/bvb/?v=17&t='+encodeURIComponent(t);
}
const APIS='https://jwpbopkoscqooovfvwqn.supabase.co/functions/v1/bvb2/api/share';
function chiudi(){ document.getElementById('sheet').style.display='none'; }
function apri(){ document.getElementById('sheet').style.display='flex'; }

async function fai(){
 if(IMG) return IMG;
 if(typeof html2canvas!=='function') throw new Error('html2canvas non caricato');
 const card=document.querySelector('.card');
 const canvas=await html2canvas(card,{backgroundColor:'#080B0D',scale:2,logging:false});
 IMG=canvas.toDataURL('image/png');
 return IMG;
}

async function condividi(){
 const btn=document.querySelector('.btns button');
 const testo=btn?btn.textContent:'';
 try{
  if(btn) btn.textContent='Preparo…';
  const img=await fai();

  // prima provo la condivisione di sistema con la foto
  if(img && navigator.canShare){
   const blob=await (await fetch(img)).blob();
   const file=new File([blob],'cashly-ciclo.png',{type:'image/png'});
   if(navigator.canShare({files:[file]})){
    if(btn) btn.textContent=testo;
    try{ await navigator.share({files:[file],text:TESTO}); return; }catch(e){}
   }
  }

  // altrimenti la mando in chat col bot
  if(img){
   const r=await fetch(APIS,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({t:new URLSearchParams(location.search).get('t')||'',img:img,testo:TESTO})});
   const j=await r.json();
   if(btn) btn.textContent=testo;
   if(!j.ok) avvisa('Il bot non riesce a mandare la foto: '+(j.error||'sconosciuto'));
   if(j.ok){
    if(window.Telegram?.WebApp){
     Telegram.WebApp.showPopup?.({title:'Fatto',message:"Ti ho mandato l'immagine in chat. Da lì puoi inoltrarla dove vuoi.",buttons:[{type:'ok'}]},()=>Telegram.WebApp.close());
     setTimeout(()=>Telegram.WebApp.close(),1800);
    } else alert("Immagine inviata in chat.");
    return;
   }
  }
 }catch(e){
  if(btn) btn.textContent=testo;
  avvisa('Errore: '+(e && e.message ? e.message : e));
  return;
 }
 if(btn) btn.textContent=testo;
 apri();
}

function avvisa(m){
 if(window.Telegram?.WebApp?.showAlert) Telegram.WebApp.showAlert(m);
 else alert(m);
}

function su(app){
 const t=encodeURIComponent(TESTO);
 const url={
  telegram:'https://t.me/share/url?url='+t,
  whatsapp:'https://wa.me/?text='+t,
  x:'https://twitter.com/intent/tweet?text='+t,
  facebook:'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent('https://cashlypro.com')+'&quote='+t
 }[app];
 if(app==='telegram' && window.Telegram?.WebApp?.openTelegramLink) Telegram.WebApp.openTelegramLink(url);
 else if(window.Telegram?.WebApp?.openLink) Telegram.WebApp.openLink(url);
 else window.open(url,'_blank');
 chiudi();
}

async function salva(){
 const img=await fai(); if(!img) return;
 const a=document.createElement('a'); a.href=img; a.download='cashly-ciclo.png'; a.click();
 chiudi();
}

async function copia(){ try{ await navigator.clipboard.writeText(TESTO); }catch(e){} chiudi(); }

carica();
</script><div id="sheet" onclick="if(event.target===this)chiudi()">
 <div class="in">
  <div class="t">Condividi su</div>
  <div class="g">
   <button onclick="conImmagine('telegram')"><span>🖼</span>Foto in chat</button>
   <button onclick="su('telegram')"><span>✈️</span>Telegram</button>
   <button onclick="su('whatsapp')"><span>💬</span>WhatsApp</button>
   <button onclick="su('x')"><span>𝕏</span>X</button>
   <button onclick="su('facebook')"><span>f</span>Facebook</button>
   <button onclick="salva()"><span>🖼</span>Salva immagine</button>
   <button onclick="copia()"><span>📋</span>Copia testo</button>
  </div>
  <button class="x" onclick="chiudi()">Chiudi</button>
 </div>
</div>
</body></html>
